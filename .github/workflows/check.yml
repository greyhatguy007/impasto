name: check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua, zsh and PyYAML
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zsh python3-yaml

      - name: Verify Python, Lua, zsh, bash, JSON, TOML and widget syntax
        run: ./setup check
